<style>
:root{--ink:#181817;--muted:#77736a;--line:#ddd6c8;--paper:#f6f0e4;--green:#0e8176;--lime:#a7b77c;--red:#c95866;--orange:#c59a22;--white:#fffdfa;--pink:#f2a8cf;--yellow:#f2d35e;--blue:#b9cff0;--navy:#17154a}
body{background:var(--paper);color:var(--ink)}
.sidebar{background:#fbf8f1;border-color:var(--line)}
.brandmark{background:var(--ink);color:var(--pink)}
.navlabel{color:#8a857b}
.nav button{color:#68645d}
.nav button.active{background:#f8dcec;color:var(--ink)}
.nav button:hover{background:#f2eadf}
.nav .count{background:var(--lime);color:var(--ink)}
.country{background:#f3ecdf}.avatar{background:var(--blue)}
.topbar{background:#f6f0e4e8;border-color:var(--line)}
.prototype{background:#dce7f7;border-color:#c9d8ed;color:var(--navy)}
.iconbtn,.btn,.searchbox,.panel,.stat,.chip,.field input,.field select{background:var(--white)}
.notification-dot{background:var(--pink)}
.btn:hover{background:#f3ecdf}.btn.primary{background:var(--ink);color:var(--white);border-color:var(--ink)}
.btn.lime{background:var(--pink);color:var(--ink)}
.hero{background:var(--ink);color:var(--white)}
.hero:after{border-color:#ffffff24;box-shadow:0 0 0 30px #ffffff0d,0 0 0 65px #ffffff0a}
.hero .eyebrow{color:var(--pink)}
.searchhint{color:#c9c4bc}.searchhint button{color:var(--pink)}
.pulsecard{background:var(--lime)}
.pulsecard p{color:#3f472f}.pulsecard .eyebrow{color:#333a28}
.radar-art{border-color:#18181730;background:repeating-radial-gradient(circle,transparent 0 28px,#18181720 29px 30px)}
.radar-art:after{border-color:var(--lime);background:var(--pink)}
.stat:nth-child(1) .stat-icon{background:var(--lime);color:var(--ink)}
.stat:nth-child(2) .stat-icon{background:var(--yellow);color:var(--ink)}
.stat:nth-child(3) .stat-icon{background:var(--blue);color:var(--ink)}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--white)}
.alertrow,.watchrow{border-color:#e8e0d4}
.statusdot{background:var(--yellow)}.statusdot.red{background:var(--red)}.statusdot.green{background:var(--green)}
.pill{background:#fbefb5;color:#675109}.pill.red{background:#f8d7e8;color:#8d245f}.pill.green{background:#dce7bd;color:#405229}
.drugicon{background:var(--blue);color:var(--navy)}
.addwatch{background:#faf6ee;color:var(--green)}
.comparebar{background:#dfe8c6}
th{background:#f5efe5}.result{background:#dce7f7}.details{background:#f3ecdf}
.notice{background:#fbefb5;color:#675109!important}
.timeline{border-color:#c7bdae}.timeline>div:before{background:var(--pink)}
.toast{background:var(--ink);color:var(--white)}
body{background-color:#fbfaf7;background-image:url('medora-pastel-glow.png');background-size:cover;background-position:center;background-attachment:fixed}
.ph{display:inline-block;font-size:19px;line-height:1;flex:0 0 auto}.brandmark .ph{font-size:25px}.nav .ph{font-size:20px}.btn .ph{font-size:17px}.iconbtn .ph{font-size:18px}.stat-icon .ph{font-size:21px}

.heading h1{font-size:34px}.section-head h2{font-size:20px}
.sidebar{background:rgba(255,255,255,.68);border-color:rgba(255,255,255,.9);backdrop-filter:blur(22px)}
.topbar{background:rgba(255,255,255,.46);border-color:rgba(255,255,255,.78);backdrop-filter:blur(18px)}
.brand{letter-spacing:-1.3px}.brandmark{border-radius:50%;background:rgba(255,255,255,.76);color:#8c6a9f;border:1px solid rgba(255,255,255,.92);box-shadow:0 8px 22px rgba(83,72,63,.08)}
.nav button{border-radius:14px}.nav button.active{background:rgba(255,255,255,.72);box-shadow:0 10px 28px rgba(83,72,63,.07)}
.nav button:hover{background:rgba(255,255,255,.82)}
.hero{background:rgba(255,255,255,.72);color:var(--ink);border:1px solid rgba(255,255,255,.94);border-radius:28px;box-shadow:0 24px 65px rgba(83,72,63,.10);backdrop-filter:blur(18px)}
.hero:after{display:none}.hero .eyebrow{color:#8c6a9f}.hero h2{font-size:32px;line-height:1.12}
.searchbox{border:1px solid rgba(217,210,201,.72);border-radius:24px;box-shadow:0 12px 30px rgba(83,72,63,.07)}
.searchhint{color:var(--muted)}.searchhint button{color:#8c6a9f}
.pulsecard{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.92);border-radius:28px;box-shadow:0 24px 65px rgba(83,72,63,.08);backdrop-filter:blur(18px)}
.pulsecard p{color:var(--muted)}.pulsecard .eyebrow{color:#8c6a9f}.radar-art{display:none}
.stat,.panel{background:rgba(255,255,255,.72);border-color:rgba(255,255,255,.92);box-shadow:0 16px 42px rgba(83,72,63,.065);backdrop-filter:blur(16px)}
.stat{border-radius:18px}.panel{border-radius:20px}
.stat-icon,.drugicon{border-radius:14px}
.btn{border-radius:18px;background:rgba(255,255,255,.78)}.btn.primary{border-radius:22px}
.chip{border-radius:14px;background:rgba(255,255,255,.72)}
.comparebar,.result,.details,.notice{border-radius:18px}
dialog{background:rgba(255,255,255,.9);border-color:rgba(255,255,255,.96);border-radius:28px;backdrop-filter:blur(22px)}
.content>*{animation:surface-in .42s cubic-bezier(.22,.8,.22,1) both}
.hero,.pulsecard,.stat,.panel,.btn,.nav button,.alertrow,.watchrow{transition:transform .22s ease,box-shadow .22s ease,background-color .22s ease,border-color .22s ease}
.hero:hover,.pulsecard:hover{transform:translateY(-2px);box-shadow:0 28px 72px rgba(83,72,63,.12)}
.stat:hover{transform:translateY(-2px);box-shadow:0 20px 48px rgba(83,72,63,.09)}
.alertrow:hover,.watchrow:hover{background:rgba(255,255,255,.58)}
.btn:hover{transform:translateY(-1px)}.btn .ph{transition:transform .22s ease}.btn:hover .ph{transform:translateX(2px)}
.nav button .ph{transition:transform .22s ease,color .22s ease}.nav button:hover .ph{transform:scale(1.08)}
.hero,.pulsecard{isolation:isolate}.hero-copy,.pulse-copy{position:relative;z-index:2}.hero-spot{position:absolute;z-index:1;width:150px;height:150px;object-fit:contain;right:18px;top:4px;filter:drop-shadow(0 14px 16px rgba(72,66,58,.1));pointer-events:none}.pulse-spot{position:absolute;z-index:1;width:150px;height:150px;object-fit:contain;right:-4px;bottom:-10px;filter:drop-shadow(0 14px 16px rgba(72,66,58,.1));pointer-events:none}.pulse-copy{max-width:68%}.stat-spot{width:48px;height:48px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 7px 8px rgba(72,66,58,.09));transition:transform .22s ease}.stat:hover .stat-spot{transform:translateY(-2px) scale(1.04)}
@keyframes surface-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:620px){
  .sidebar{background:var(--ink);border-color:var(--ink)}
  .nav button{color:#bdb8af}.nav button:hover{background:transparent}

  .topbar{background:var(--paper)}
  .heading h1{font-size:31px}.hero{border-radius:24px}.hero h2{font-size:30px;max-width:210px}.pulsecard{border-radius:24px}.hero-spot{width:116px;height:116px;right:2px;top:11px}.pulse-spot{width:128px;height:128px;right:-10px;bottom:-8px}.pulse-copy{max-width:72%}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{display:block;min-width:0;padding:10px 8px}.stat>div{min-width:0}.stat-spot{width:38px;height:38px;margin-bottom:3px}.metriclabel,.stat small{overflow-wrap:anywhere}
}
@media(prefers-reduced-motion:reduce){.content>*,.hero,.pulsecard,.stat,.panel,.btn,.nav button,.alertrow,.watchrow,.btn .ph,.nav button .ph{animation:none!important;transition:none!important}}

</head><body>
<aside class="sidebar"><a class="brand" href="index.html"><span class="brandmark" data-icon="spark"></span>medora</a><div class="tagline">CLARITATE ÎN PRACTICĂ</div><div class="navlabel">SPAȚIUL TĂU DE LUCRU</div><nav class="nav" aria-label="Navigare principală"><button data-page="overview" class="active"><span data-icon="grid"></span>Privire de ansamblu</button><button data-page="catalog"><span data-icon="pill"></span>Medicamente</button><button data-page="radar"><span data-icon="radar"></span>Radar alerte<span class="count">3</span></button><button data-page="watch"><span data-icon="bookmark"></span>Lista mea<span class="count" id="navcount">3</span></button><button data-page="tools"><span data-icon="sliders"></span>Instrumente</button></nav><div class="navlabel">RESURSE</div><nav class="nav secondary" aria-label="Resurse"><button data-page="sources"><span data-icon="shield"></span>Surse & transparență</button><button id="research-nav"><span data-icon="book"></span>Research & strategie<span style="margin-left:auto">↗</span></button></nav><div class="sidebar-bottom"><div class="country"><span>🇷🇴</span><div>România<small>Prima piață · concept</small></div></div><div class="profile"><div class="avatar">DR</div><div>Cont demonstrativ<small>Medicină de familie</small></div></div></div></aside>
<main class="app"><header class="topbar"><div class="crumb"><span data-icon="home"></span><span>/</span><strong id="crumb">Privire de ansamblu</strong></div><a class="brand mobilebrand" href="index.html"><span class="brandmark" data-icon="spark"></span>medora</a><div class="topright"><span class="date">Sâmbătă, 12 septembrie 2026</span><span class="prototype">PROTOTIP · DATE DEMO</span><button class="iconbtn" id="notifications" aria-label="Preferințe alerte"><span data-icon="bell"></span><i class="notification-dot"></i></button></div></header><div class="content" id="content"></div></main>
<dialog id="modal" aria-labelledby="modal-title"><div class="modalhead"><div><div class="eyebrow" id="modal-kicker">MEDORA</div><h2 id="modal-title"></h2></div><button class="iconbtn" id="close-modal" aria-label="Închide"><span data-icon="x"></span></button></div><div class="modalbody" id="modal-body"></div></dialog><div id="toast" role="status" aria-live="polite" class="toast"></div>
<script>
const phosphor={spark:'asterisk',grid:'squares-four',pill:'pill',radar:'broadcast',bookmark:'bookmark-simple',sliders:'sliders-horizontal',shield:'shield-check',book:'book-open',home:'house',bell:'bell',search:'magnifying-glass',arrow:'arrow-right',plus:'plus',x:'x',clock:'clock',alert:'warning',check:'check',link:'link-simple',download:'download-simple'};
const icon=n=>`<i class="ph ph-${phosphor[n]||phosphor.pill}" aria-hidden="true"></i>`;
function icons(){document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon))}icons();
const drugs=[
{id:'amoxi',name:'Amoxi Demo',dci:'Amoxicilină',strength:'500 mg',form:'Capsule',atc:'J01CA04',status:'temporary',date:'01 oct. 2026',note:'Întrerupere temporară anunțată. Dată estimată de revenire: 15 noiembrie.',event:'Discontinuitate temporară',group:'Antibiotice'},
{id:'metfo',name:'Metfo Demo',dci:'Metformină',strength:'850 mg',form:'Comprimate filmate',atc:'A10BA02',status:'permanent',date:'01 dec. 2026',note:'Încetare permanentă a comercializării pentru această prezentare.',event:'Discontinuitate permanentă',group:'Diabet'},
{id:'levo',name:'Levo Demo',dci:'Levotiroxină',strength:'50 μg',form:'Comprimate',atc:'H03AA01',status:'resumed',date:'10 sept. 2026',note:'Reluare a comercializării anunțată. Stocul local rămâne necunoscut.',event:'Comercializare reluată',group:'Endocrinologie'},
{id:'amoxi2',name:'Amoxi B Demo',dci:'Amoxicilină',strength:'500 mg',form:'Capsule',atc:'J01CA04',status:'unknown',group:'Antibiotice'},
{id:'metfo2',name:'Metfo B Demo',dci:'Metformină',strength:'850 mg',form:'Comprimate filmate',atc:'A10BA02',status:'unknown',group:'Diabet'},
{id:'rami',name:'Rami Demo',dci:'Ramipril',strength:'5 mg',form:'Comprimate',atc:'C09AA05',status:'unknown',group:'Cardiologie'},
{id:'atorva',name:'Atorva Demo',dci:'Atorvastatină',strength:'20 mg',form:'Comprimate filmate',atc:'C10AA05',status:'unknown',group:'Cardiologie'},
{id:'panto',name:'Panto Demo',dci:'Pantoprazol',strength:'40 mg',form:'Comprimate gastrorezistente',atc:'A02BC02',status:'unknown',group:'Gastroenterologie'}];
const sourceUrls={nomen:'https://nomenclator.anm.ro/medicamente',dis:'https://www.anm.ro/medicamente-de-uz-uman/autorizare-medicamente/notificari-discontinuitate-medicamente/',ema:'https://esmp.ema.europa.eu/',dhpc:'https://www.anm.ro/medicamente-de-uz-uman/farmacovigilenta/comunicari-directe-catre-profesionistii-din-domeniul-sanatatii-cdpds/'};
function readStore(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
let followed=readStore('medora-followed',['amoxi','metfo','rami']);if(!Array.isArray(followed))followed=[];followed=followed.filter(id=>drugs.some(d=>d.id===id));let prefs=readStore('medora-prefs',{frequency:'daily',temporary:true,permanent:true,resumed:true});let selected=[];let page='overview',filter='all',query=new URLSearchParams(location.search).get('q')||'';let toastTimer;
const $=s=>document.querySelector(s);const get=id=>drugs.find(d=>d.id===id);const normal=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function save(key,v){try{localStorage.setItem(key,JSON.stringify(v))}catch{toast('Stocare locală indisponibilă în acest browser.')}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3000)}
const badge=d=>`<span class="pill ${d.status==='permanent'?'red':d.status==='resumed'?'green':''}">${({temporary:'Temporară · demo',permanent:'Permanentă · demo',resumed:'Reluată · demo',unknown:'Statut necunoscut'})[d.status]}</span>`;
const footer=()=>`<footer class="footer"><span>Medora · Concept independent pentru profesioniști</span><span>Produse și evenimente fictive. Fără utilizare clinică. &nbsp; <a href="#sources">Despre date ↗</a></span></footer>`;
const head=(title,sub,button='')=>`<div class="heading"><div><div class="eyebrow">SPAȚIUL TĂU CLINIC / ROMÂNIA</div><h1>${title}</h1><p class="sub">${sub}</p></div>${button}</div>`;
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#navcount').textContent=followed.length;$('#crumb').textContent=({overview:'Privire de ansamblu',catalog:'Medicamente',radar:'Radar alerte',watch:'Lista mea',tools:'Instrumente',sources:'Surse & transparență'})[page];$('#content').innerHTML=({overview:overview,catalog:catalog,radar:radar,watch:watch,tools:tools,sources:sources})[page]()+footer();bind();}
function alertrows(list){return list.length?list.map(d=>`<article class="alertrow"><i class="statusdot ${d.status==='permanent'?'red':d.status==='resumed'?'green':''}"></i><div class="alerttext"><div class="rowtitle"><button class="plain" data-detail="${d.id}">${d.name} ${d.strength}</button><span class="mini">SCENARIU FICTIV</span></div><p>${d.note}</p><div class="alertmeta">${badge(d)}<span>${d.date}</span></div></div><button class="rowwatch ${followed.includes(d.id)?'on':''}" data-follow="${d.id}" aria-label="${followed.includes(d.id)?'Nu mai urmări':'Urmărește'} ${d.name}" aria-pressed="${followed.includes(d.id)}">${icon(followed.includes(d.id)?'bookmark':'plus')}</button></article>`).join(''):'<div class="empty">Nicio alertă pentru acest filtru.</div>'}
function watchrows(){return followed.length?followed.slice(0,4).map(id=>{let d=get(id);return `<div class="watchrow"><div class="drugicon">${icon('pill')}</div><div class="info"><button class="plain" data-detail="${id}">${d.name} ${d.strength}</button><small>${d.dci} · ${d.event?'Alertă demo':'Statut necunoscut'}</small></div><button class="rowwatch arrow" data-detail="${id}" aria-label="Detalii ${d.name}">${icon('arrow')}</button></div>`}).join(''):'<div class="empty">Urmărește primul medicament din catalog.</div>'}
function chips(){return [['all','Toate'],['temporary','Temporare'],['permanent','Permanente'],['resumed','Reluate']].map(([id,l])=>`<button class="chip ${filter===id?'active':''}" data-filter="${id}" aria-pressed="${filter===id}">${l}</button>`).join('')}
function overview(){return head('Mai multă claritate. Mai puțin timp pierdut.','Informația relevantă, înainte de următoarea consultație.',`<button class="btn" data-settings>${icon('sliders')}Personalizează alertele</button>`)+`<div class="hero-grid"><section class="hero"><img class="hero-spot" src="spot-icons/medicine.png" alt="" aria-hidden="true"><div class="hero-copy"><div class="eyebrow">INFORMAȚIA POTRIVITĂ, LA UN PAS</div><h2>Ce medicament<br>cauți astăzi?</h2><form id="hero-search" class="searchbox">${icon('search')}<input name="q" aria-label="Caută medicamente" placeholder="Denumire, substanță activă sau cod ATC" autocomplete="off"><span class="key">↵</span></form><div class="searchhint">Încearcă: <button data-search="amoxicilina">amoxicilină</button> &nbsp;·&nbsp; <button data-search="metformina">metformină</button> &nbsp;·&nbsp; 8 produse demonstrative</div></div></section><section class="pulsecard"><img class="pulse-spot" src="spot-icons/radar.png" alt="" aria-hidden="true"><div class="pulse-copy"><div class="eyebrow">${icon('radar')} &nbsp; RADAR MEDORA</div><h2>Schimbările nu așteaptă.</h2><p>Urmărește discontinuități și reveniri pentru medicamentele care contează în practica ta.</p><button class="btn primary small" data-go="radar">Vezi cele 3 alerte demo ${icon('arrow')}</button></div></section></div><div class="stats"><div class="stat"><img class="stat-spot" src="spot-icons/watchlist.png" alt="" aria-hidden="true"><div><strong>${followed.length}</strong><div class="metriclabel">Medicamente urmărite</div><small>Lista ta personală</small></div></div><div class="stat"><img class="stat-spot" src="spot-icons/compare.png" alt="" aria-hidden="true"><div><strong>${drugs.filter(d=>d.status==='temporary'||d.status==='permanent').length}</strong><div class="metriclabel">Discontinuități</div><small>Scenarii demonstrative</small></div></div><div class="stat"><img class="stat-spot" src="spot-icons/sources.png" alt="" aria-hidden="true"><div><strong>01</strong><div class="metriclabel">Revenire anunțată</div><small>Scenariu demonstrativ</small></div></div></div><div class="lower-grid"><section><div class="section-head"><h2>În radarul tău</h2><button class="linkbutton" data-go="radar">Toate alertele ${icon('arrow')}</button></div><div class="panel"><div class="filters">${chips()}</div><div id="alerts">${alertrows(drugs.filter(d=>d.event&&(filter==='all'||d.status===filter)))}</div></div></section><section><div class="section-head"><h2>Medicamente urmărite</h2><button class="linkbutton" data-go="watch">Lista mea ${icon('arrow')}</button></div><div class="panel">${watchrows()}<button class="addwatch" data-go="catalog">＋ Adaugă un medicament</button></div><div class="source-note">${icon('shield')}<span>Fiecare schimbare merită o sursă.<br>În produsul final: document original, dată și istoric. În acest mock: scenarii fictive.</span></div></section></div>`}
function catalog(){return head('Medicamente','Caută, urmărește și compară prezentări. Catalog demonstrativ cu 8 produse.')+`<div class="searchbox catalog-search">${icon('search')}<input id="catalog-query" aria-label="Caută în catalog" placeholder="Denumire, DCI, ATC sau specialitate"></div><div class="panel tablewrap"><table><thead><tr><th>Compară</th><th>Medicament / DCI</th><th>Formă / cod ATC</th><th>Disponibilitate</th><th>Urmărire</th></tr></thead><tbody id="catalog-rows"></tbody></table></div><div class="comparebar"><span id="compare-text">Selectează două prezentări pentru comparație.</span><button class="btn primary" id="compare" ${selected.length===2?'':'disabled'}>${icon('sliders')}Compară selecția</button></div><p class="source-note">Numele comerciale și statusurile sunt fictive. Aceeași DCI nu garantează substituția clinică.</p>`}
function tableRows(list){return list.length?list.map(d=>`<tr><td><input class="tick" type="checkbox" data-select="${d.id}" aria-label="Compară ${d.name}" ${selected.includes(d.id)?'checked':''}></td><td><button class="plain" data-detail="${d.id}">${d.name} ${d.strength}</button><small>${d.dci}</small></td><td>${d.form}<small>${d.atc}</small></td><td>${badge(d)}</td><td><button class="btn small" data-follow="${d.id}" aria-pressed="${followed.includes(d.id)}">${icon(followed.includes(d.id)?'check':'plus')}${followed.includes(d.id)?'Urmărit':'Urmărește'}</button></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">Niciun rezultat în catalogul demo. Încearcă „amoxi” sau „metformină”.</div></td></tr>'}
function updateCatalog(){let list=drugs.filter(d=>normal([d.name,d.dci,d.atc,d.group].join(' ')).includes(normal(query)));$('#catalog-rows').innerHTML=tableRows(list);$('#compare').disabled=selected.length!==2;$('#compare-text').textContent=selected.length?selected.map(id=>get(id).name).join(' + ')+' · '+selected.length+'/2 selectate':'Selectează două prezentări pentru comparație.';bindRows()}
function radar(){return head('Radar de disponibilitate','De la notificare la acțiune: ce se schimbă, când și pentru ce prezentare.',`<button class="btn primary" data-settings>${icon('bell')}Configurează alertele</button>`)+`<p class="notice">Toate cele 3 evenimente sunt fictive. O discontinuitate notificată nu dovedește absența din fiecare farmacie.</p><div class="panel fullradar"><div class="filters">${chips()}<label style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px"><input id="only-followed" type="checkbox" class="tick">Doar lista mea</label></div><div id="alerts">${alertrows(drugs.filter(d=>d.event&&(filter==='all'||d.status===filter)))}</div></div><div class="source-note">${icon('link')}<a href="${sourceUrls.dis}" target="_blank" rel="noopener">Vezi sursa reală: notificări de discontinuitate ANMDMR ↗</a></div>`}
function watch(){return head('Lista mea','Medicamentele importante pentru practica ta. Preferințele se păstrează în acest browser.',`<button class="btn" data-go="catalog">${icon('plus')}Adaugă medicament</button>`)+`<div class="panel">${followed.length?followed.map(id=>{let d=get(id);return `<div class="watchrow"><div class="drugicon">${icon('pill')}</div><div class="info"><button class="plain" data-detail="${id}">${d.name} ${d.strength}</button><small>${d.dci} · ${d.form}</small></div>${badge(d)}<button class="iconbtn" data-follow="${id}" aria-label="Elimină ${d.name} din lista mea">${icon('x')}</button></div>`}).join(''):'<div class="empty">Lista este goală. Adaugă medicamente din catalog.</div>'}</div><div class="comparebar"><span>Alerte pentru produsele pe care le urmărești.</span><button class="btn" data-settings>Preferințe ${icon('arrow')}</button></div>`}
function tools(){return head('Instrumente','Un exemplu de calculator funcțional. Fără recomandări terapeutice.')+`<section class="panel toolcard"><div class="eyebrow">CALCUL MATEMATIC · ADULȚI</div><h2>Indice de masă corporală</h2><p class="sub" style="margin-top:10px">IMC = greutate (kg) / înălțime² (m²).</p><form id="bmi-form"><label class="field">Greutate (kg)<input type="number" name="weight" min="1" max="500" step="0.1" value="70" required></label><label class="field">Înălțime (cm)<input type="number" name="height" min="50" max="250" step="0.1" value="175" required></label><button class="btn primary" type="submit">Calculează ${icon('arrow')}</button></form><div class="result" id="bmi-result" aria-live="polite">Introdu valorile pentru calcul. Rezultatul nu include interpretare clinică.</div></section>`}
function sources(){return head('O sursă clară. Pentru fiecare informație.','Sursele candidate pentru produsul final. Nicio conexiune live în acest prototip.')+`<div class="sourcesgrid">${[['NOMENCLATOR','ANMDMR · Identitatea medicamentului','Denumire, DCI, formă, cod CIM, APP și documente oficiale. Autorizarea nu confirmă stocul.',sourceUrls.nomen],['DISPONIBILITATE','ANMDMR · Discontinuități','Notificări de întrerupere temporară sau permanentă. Fundament pentru alerte personalizate.',sourceUrls.dis],['SIGURANȚĂ','ANMDMR · Comunicări directe','Informații adresate profesioniștilor. Flux distinct de discontinuitățile comerciale.',sourceUrls.dhpc],['EXTINDERE EUROPEANĂ','EMA · Cataloage de discontinuități','Cataloage publice și registre naționale. Fără promisiunea unui inventar european complet.',sourceUrls.ema]].map(([e,h,p,url])=>`<section class="panel sourcecard"><div class="eyebrow">${e}</div><h3>${h}</h3><p>${p}</p><a class="btn small" href="${url}" target="_blank" rel="noopener">Deschide sursa ${icon('arrow')}</a></section>`).join('')}</div><div class="panel sourcecard" style="margin-top:18px"><h3>Ce funcționează în acest mock</h3><p>Căutare locală, filtre, listă urmărită persistentă, fișe, comparație, calculator IMC și preferințe salvate. Notificările sunt previzualizări locale; nu se trimit emailuri sau notificări push.</p><a class="btn" href="research.html" target="_blank">Citește researchul și prioritățile ${icon('arrow')}</a></div>`}
function navigate(next){if(!['overview','catalog','radar','watch','tools','sources'].includes(next))next='overview';page=next;filter='all';location.hash=next;render();window.scrollTo(0,0)}
function follow(id){if(followed.includes(id)){followed=followed.filter(x=>x!==id);toast('Medicament eliminat din lista mea.')}else{followed.push(id);toast('Medicament adăugat în lista mea.')}save('medora-followed',followed);render()}
function openModal(title,kicker,body){$('#modal-title').textContent=title;$('#modal-kicker').textContent=kicker;$('#modal-body').innerHTML=body;if(!$('#modal').open)$('#modal').showModal()}
function detail(id){let d=get(id);openModal(d.name+' '+d.strength,'FIȘĂ DEMO · PRODUS FICTIV',`<div class="rowtitle">${badge(d)}</div><p>Prezentare fictivă pentru testarea interfeței. Nu reprezintă un produs autorizat și nu conține recomandări medicale.</p><div class="details"><div><small>Substanță activă</small>${d.dci}</div><div><small>Concentrație</small>${d.strength}</div><div><small>Formă</small>${d.form}</div><div><small>Cod ATC ilustrativ</small>${d.atc}</div><div><small>Identificator local</small>DEMO-${d.id.toUpperCase()}</div><div><small>Stoc în farmacii</small>Necunoscut</div></div><h3>Istoricul disponibilității</h3>${d.event?`<div class="timeline"><div><small>09 sept. 2026 · Scenariu demonstrativ</small>Notificare introdusă în radar</div><div><small>${d.date} · Dată fictivă</small>${d.event}</div></div><p>${d.note}</p>`:'<p>Nu avem evenimente pentru acest produs demo. Lipsa unei alerte nu confirmă disponibilitatea.</p>'}<div class="modalfoot"><button id="detail-follow" class="btn primary">${icon(followed.includes(id)?'check':'plus')}${followed.includes(id)?'Nu mai urmări':'Urmărește medicamentul'}</button><button id="same-dci" class="btn">Compară prezentări ${icon('arrow')}</button><a class="btn" href="${sourceUrls.nomen}" target="_blank" rel="noopener">Deschide nomenclatorul ↗</a></div>`);$('#detail-follow').onclick=()=>{follow(id);detail(id)};$('#same-dci').onclick=()=>{$('#modal').close();query=d.dci;selected=[id];navigate('catalog')};}
function settings(){openModal('Alerte care contează pentru tine','PREFERINȚE · SALVARE LOCALĂ',`<p>Alege tipurile de evenimente pentru lista ta. În acest prototip, notificările se pot doar previzualiza.</p><form id="prefs-form"><label class="checkline"><input class="tick" name="temporary" type="checkbox" ${prefs.temporary?'checked':''}>Discontinuități temporare</label><label class="checkline"><input class="tick" name="permanent" type="checkbox" ${prefs.permanent?'checked':''}>Discontinuități permanente</label><label class="checkline"><input class="tick" name="resumed" type="checkbox" ${prefs.resumed?'checked':''}>Reluări de comercializare</label><label class="field">Frecvență dorită în produsul final<select name="frequency"><option value="daily" ${prefs.frequency==='daily'?'selected':''}>Rezumat zilnic</option><option value="immediate" ${prefs.frequency==='immediate'?'selected':''}>La fiecare schimbare</option><option value="weekly" ${prefs.frequency==='weekly'?'selected':''}>Rezumat săptămânal</option></select></label><button class="btn primary" type="submit">Salvează și previzualizează ${icon('arrow')}</button></form>`);$('#prefs-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);prefs={frequency:f.get('frequency'),temporary:f.has('temporary'),permanent:f.has('permanent'),resumed:f.has('resumed')};save('medora-prefs',prefs);let list=drugs.filter(d=>followed.includes(d.id)&&prefs[d.status]);openModal('Preferințe salvate','PREVIZUALIZARE · NU SE TRIMITE',`<p>Ritm selectat: ${({daily:'zilnic',weekly:'săptămânal',immediate:'la fiecare schimbare'})[prefs.frequency]}. ${list.length} evenimente demo corespund listei și preferințelor tale.</p><div class="panel">${alertrows(list)}</div><p style="margin-top:18px">Trimiterea emailurilor și notificărilor push necesită implementarea serviciului.</p>`);bindRows()};}
function compare(){if(selected.length!==2)return;const a=get(selected[0]),b=get(selected[1]);openModal('Comparație de prezentări','DATE DEMO · FĂRĂ ECHIVALENȚĂ CLINICĂ',`<p>Aceeași substanță, concentrație și formă nu garantează interschimbabilitatea. Exemplu de comparație administrativă.</p><div class="tablewrap"><table><thead><tr><th>Câmp</th><th>${a.name}</th><th>${b.name}</th></tr></thead><tbody>${[['DCI',a.dci,b.dci],['Concentrație',a.strength,b.strength],['Formă',a.form,b.form],['ATC',a.atc,b.atc],['Statut',badge(a),badge(b)],['Stoc local','Necunoscut','Necunoscut']].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="result">${a.dci===b.dci&&a.strength===b.strength&&a.form===b.form?'DCI, concentrație și formă coincid în setul demo.':'Prezentările diferă. Nu sunt marcate drept echivalente.'}</div>`)}
function bindRows(){document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>follow(b.dataset.follow));document.querySelectorAll('[data-select]').forEach(b=>b.onchange=()=>{let id=b.dataset.select;if(b.checked&&selected.length===2){b.checked=false;toast('Poți compara două prezentări simultan.');return}selected=b.checked?[...selected,id]:selected.filter(x=>x!==id);updateCatalog()})}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{query='';navigate(b.dataset.go)});document.querySelectorAll('[data-settings]').forEach(b=>b.onclick=settings);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(c=>{c.classList.toggle('active',c.dataset.filter===filter);c.setAttribute('aria-pressed',c.dataset.filter===filter)});filterAlerts()});bindRows();if($('#hero-search'))$('#hero-search').onsubmit=e=>{e.preventDefault();query=new FormData(e.target).get('q').trim();navigate('catalog')};document.querySelectorAll('[data-search]').forEach(b=>b.onclick=()=>{query=b.dataset.search;navigate('catalog')});if($('#catalog-query')){$('#catalog-query').value=query;$('#catalog-query').oninput=e=>{query=e.target.value;updateCatalog()};$('#compare').onclick=compare;updateCatalog()}if($('#only-followed'))$('#only-followed').onchange=filterAlerts;if($('#bmi-form'))$('#bmi-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),w=Number(f.get('weight')),h=Number(f.get('height'));if(!Number.isFinite(w)||!Number.isFinite(h)||w<=0||h<=0)return;let r=w/((h/100)**2);$('#bmi-result').innerHTML=`<strong>${r.toLocaleString('ro-RO',{maximumFractionDigits:1})}</strong> kg/m²<br><span class="sub">${w} kg / (${h/100} m)² · rezultat matematic, fără interpretare clinică.</span>`};}
function filterAlerts(){const only=$('#only-followed')?.checked;$('#alerts').innerHTML=alertrows(drugs.filter(d=>d.event&&(filter==='all'||d.status===filter)&&(!only||followed.includes(d.id))));bindRows()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{query='';navigate(b.dataset.page)});$('#notifications').onclick=settings;$('#close-modal').onclick=()=>$('#modal').close();$('#modal').onclick=e=>{if(e.target===$('#modal')){let r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}};$('#research-nav').onclick=()=>window.open('research.html','_blank');window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(p!==page)navigate(p)});page=['overview','catalog','radar','watch','tools','sources'].includes(location.hash.slice(1))?location.hash.slice(1):'overview';render();const initialDrug=new URLSearchParams(location.search).get('drug');if(initialDrug&&get(initialDrug))detail(initialDrug);
</script></body></html>
